name: CI

# This workflow runs only when started by hand (Actions tab -> CI -> Run workflow), so it costs nothing by default.
# To run it automatically, add for example:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --only-binary :all: ruff==0.17.6"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - run: mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - run: pytest --cov=. --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - run: pip-audit -r requirements.txt
      - run: bandit -c bandit.yaml -r . --exclude ./tests,./venv
